<style>
        .geometric-accent-tl {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(11, 202, 147, 0.1) 0%, transparent 50%);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 0;
        }
        .geometric-accent-br {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 250px;
            height: 250px;
            background: linear-gradient(-45deg, rgba(11, 202, 147, 0.05) 0%, transparent 50%);
            clip-path: polygon(100% 100%, 100% 0, 0 100%);
            z-index: 0;
        }
        
        /* Strict pill/precision overrides from prompt */
        .input-precision {
            border-radius: 0px !important;
            border-color: #353945 !important;
        }
        .input-precision:focus {
            border-color: #0BCA93 !important;
            box-shadow: none !important;
        }
        .card-precision {
            border-radius: 0px !important;
            border: 1px solid #353945 !important;
        }
        .btn-pill {
            border-radius: 9999px !important;

<body class="bg-surface text-on-surface font-body-default min-h-screen flex items-center justify-center relative overflow-hidden"><!-- BEGIN: Blurred Background Image -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-40 pointer-events-none bg-[radial-gradient(circle,_var(--tw-gradient-stops))] from-surface-dim via-surface to-background blur-[100px]"></div>
<!-- END: Blurred Background Image -->
<!-- BEGIN: MainContainer -->
<main class="w-full flex flex-col items-center justify-center p-6 sm:p-12 z-10 relative"><!-- BEGIN: HeaderSection -->
<header class="mb-10 flex flex-col items-center text-center">
<div class="mb-4 flex flex-col items-center"><!-- Institutional logo centered -->
<div class="w-16 h-16 bg-primary rounded-none flex items-center justify-center text-on-primary mb-5 shadow-lg border border-outline-variant/30">
<svg fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="32"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
</div>
<h1 class="text-2xl font-extrabold text-on-surface tracking-tight font-kpi-display">CASH MANAGEMENT</h1>
<p class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-label-caps mt-2"><span style="color: rgb(0, 0, 0); font-family: Consolas, &quot;Courier New&quot;, monospace; font-size: 14px; white-space: pre; background-color: rgb(239, 239, 239);">control your money, control your life</span></p></div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: RegistrationCard -->
<section class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant p-10 md:p-12 shadow-2xl rounded-none relative">
<!-- Top accent bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="text-center mb-8">
<h2 class="text-xl font-bold text-on-surface font-h1 uppercase">Register</h2>
<p class="text-sm text-on-surface-variant mt-2 font-body-default">Create your institutional account</p>
</div>
<form action="#" class="space-y-6" method="POST">
<div data-purpose="input-group">
<label class="block text-xs font-bold text-on-surface mb-2 uppercase tracking-wide font-label-caps" for="first-name">First Name</label>
<input class="input-precision w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none" id="first-name" name="first-name" placeholder="Jane" required="" type="text">
</div>
<div data-purpose="input-group">
<label class="block text-xs font-bold text-on-surface mb-2 uppercase tracking-wide font-label-caps" for="email">Corporate Email</label>
<input class="input-precision w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none" id="email" name="email" placeholder="jane@company.com" required="" type="email">
</div>
<div data-purpose="input-group">
<label class="block text-xs font-bold text-on-surface mb-2 uppercase tracking-wide font-label-caps" for="password">Password</label>
<input class="input-precision w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div data-purpose="input-group">
<label class="block text-xs font-bold text-on-surface mb-2 uppercase tracking-wide font-label-caps" for="confirm-password">Confirm Password</label>
<input class="input-precision w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password">
</div>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-bold py-4 px-6 hover:bg-primary/90 transition-all text-sm uppercase tracking-widest shadow-md font-body-bold rounded-full" type="submit">
                Register Account
            </button>
</div>
<div class="text-center mt-6 text-sm text-on-surface-variant font-body-default">
            Already have an account? <a class="text-secondary font-bold hover:text-primary hover:underline transition-colors" href="#">Sign In</a>
</div>
</form>
</section>
<!-- END: RegistrationCard -->
<footer class="mt-12 text-on-surface-variant text-[10px] uppercase tracking-widest text-center opacity-60 font-label-caps">
    © 2024 • Internal System v2.4
</footer></main>
