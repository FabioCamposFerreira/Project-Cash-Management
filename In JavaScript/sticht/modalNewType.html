<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" class="" />
    <meta class="" content="width=device-width, initial-scale=1.0" name="viewport" />
    <title class="">New Transaction Type Modal</title>
    <script class="" src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link class="" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link class=""
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script class=""
        id="tailwind-config">      tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-container": "#60fdc1", "surface-container-highest": "#e5e2e1", "outline-variant": "#c7c6cb", "on-tertiary-fixed": "#201b16", "on-tertiary-container": "#8b827b", "primary-fixed": "#e3e2e7", "on-primary-fixed-variant": "#46464b", "tertiary": "#000000", "on-secondary": "#ffffff", "on-primary-fixed": "#1a1b1f", "surface-bright": "#fcf8f8", "primary": "#000000", "primary-container": "#1a1b1f", "on-background": "#1c1b1c", "on-secondary-container": "#007352", "surface-container-high": "#ebe7e7", "secondary-fixed": "#60fdc1", "error": "#ba1a1a", "surface-tint": "#5e5e63", "background": "#fcf8f8", "inverse-on-surface": "#f4f0f0", "on-tertiary-fixed-variant": "#4c463f", "on-error": "#ffffff", "surface-dim": "#ddd9d9", "secondary-fixed-dim": "#3bdfa7", "on-primary-container": "#838388", "surface-container": "#f1eded", "on-error-container": "#93000a", "surface-container-low": "#f7f3f2", "surface-container-lowest": "#ffffff", "on-surface-variant": "#46464b", "outline": "#77777b", "tertiary-container": "#201b16", "on-tertiary": "#ffffff", "on-surface": "#1c1b1c", "surface-variant": "#e5e2e1", "on-secondary-fixed": "#002115", "tertiary-fixed-dim": "#cfc5bd", "tertiary-fixed": "#ece1d8", "on-secondary-fixed-variant": "#005139", "error-container": "#ffdad6", "on-primary": "#ffffff", "primary-fixed-dim": "#c7c6cb", "secondary": "#006c4d", "inverse-surface": "#313030", "surface": "#fcf8f8", "inverse-primary": "#c7c6cb" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px", "none": "0px" }, "spacing": { "gutter": "16px", "md": "16px", "lg": "24px", "xs": "4px", "base": "8px", "xl": "48px", "sm": "8px", "container-margin": "16px" }, "fontFamily": { "label-caps": ["Inter"], "kpi-display": ["Inter"], "h1": ["Inter"], "body-bold": ["Inter"], "h2": ["Inter"], "body-default": ["Inter"], "caption": ["Inter"] }, "fontSize": { "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }], "kpi-display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "h1": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "body-bold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "h2": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }] } } } }    </script>
    <style class="">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="text-on-background min-h-screen font-body-default text-body-default flex flex-col md:flex-row relative bg-white">
    <!-- Mock Background Content -->
    <!-- Modal Overlay -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-md bg-tertiary/40 backdrop-blur-sm">
        <!-- Modal Container (0px radius as requested) -->
        <div aria-labelledby="modal-title" aria-modal="true"
            class="bg-surface-container-lowest w-full max-w-2xl border border-outline-variant shadow-[0_4px_20px_rgba(26,27,31,0.05)] flex flex-col max-h-[921px] overflow-hidden rounded-[10px]"
            role="dialog">
            <!-- Modal Header -->
            <div
                class="flex items-center justify-between px-lg py-md border-outline-variant shrink-0 bg-surface-container-lowest sticky top-0 z-10">
                <h2 class="font-h2 text-h2 text-primary" id="modal-title">New Transaction Type</h2>
                <button aria-label="Close modal" class="text-outline hover:text-primary transition-colors p-xs"
                    type="button">
                    <span class="material-symbols-outlined text-4xl" data-icon="close">close</span>
                </button>
            </div>
            <!-- Modal Body (Scrollable) -->
            <div class="p-lg overflow-y-auto space-y-lg flex-1">
                <!-- Type Name -->
                <div class="flex flex-col gap-xs">
                    <label class="font-body-bold text-body-bold text-on-surface" for="typeName">Type Name</label>
                    <input
                        class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant text-primary font-body-default text-body-default placeholder-outline focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors rounded-none"
                        id="typeName" name="typeName" placeholder="Enter type name (e.g., Transfer)" type="text" />
                </div>
                <!-- Values Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                    <!-- Minimum Value -->
                    <div class="flex flex-col gap-xs">
                        <label class="font-body-bold text-body-bold text-on-surface" for="minValue">Minimum
                            Value</label>
                        <div class="relative">
                            <span
                                class="absolute left-md top-1/2 -translate-y-1/2 text-outline material-symbols-outlined"
                                data-icon="attach_money">attach_money</span>
                            <input
                                class="w-full h-12 pl-xl pr-md bg-surface-container-lowest border border-outline-variant text-primary font-body-default text-body-default placeholder-outline focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors rounded-none"
                                id="minValue" min="0" name="minValue" placeholder="0.00" type="number" />
                        </div>
                    </div>
                    <!-- Maximum Value -->
                    <div class="flex flex-col gap-xs">
                        <label class="font-body-bold text-body-bold text-on-surface" for="maxValue">Maximum
                            Value</label>
                        <div class="relative">
                            <span
                                class="absolute left-md top-1/2 -translate-y-1/2 text-outline material-symbols-outlined"
                                data-icon="attach_money">attach_money</span>
                            <input
                                class="w-full h-12 pl-xl pr-md bg-surface-container-lowest border border-outline-variant text-primary font-body-default text-body-default placeholder-outline focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors rounded-none"
                                id="maxValue" name="maxValue" placeholder="Unlimited" type="number" />
                        </div>
                    </div>
                </div>
                <!-- Dates Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                    <!-- Start Date -->
                    <div class="flex flex-col gap-xs">
                        <label class="font-body-bold text-body-bold text-on-surface" for="startDate">Start Date</label>
                        <div class="relative">
                            <input
                                class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant text-primary font-body-default text-body-default placeholder-outline focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors [&amp;::-webkit-calendar-picker-indicator]:opacity-50 hover:[&amp;::-webkit-calendar-picker-indicator]:opacity-100 [&amp;::-webkit-calendar-picker-indicator]:cursor-pointer rounded-none"
                                id="startDate" name="startDate" type="date" />
                        </div>
                    </div>
                    <!-- End Date -->
                    <div class="flex flex-col gap-xs">
                        <label class="font-body-bold text-body-bold text-on-surface" for="endDate">End Date</label>
                        <div class="relative">
                            <input
                                class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant text-primary font-body-default text-body-default placeholder-outline focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors [&amp;::-webkit-calendar-picker-indicator]:opacity-50 hover:[&amp;::-webkit-calendar-picker-indicator]:opacity-100 [&amp;::-webkit-calendar-picker-indicator]:cursor-pointer rounded-none"
                                id="endDate" name="endDate" type="date" />
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal Footer -->
            <div
                class="flex items-center gap-md px-lg py-md bg-surface-container-lowest shrink-0 sticky bottom-0 z-10 flex-row">
                <button
                    class="h-12 px-lg font-body-bold text-body-bold text-primary bg-transparent border border-outline-variant rounded-full hover:bg-surface-container transition-colors flex-1"
                    type="button">
                    Cancel
                </button>
                <button
                    class="h-12 px-xl font-body-bold text-body-bold text-on-primary bg-primary-container rounded-full hover:opacity-90 active:opacity-80 transition-opacity flex items-center justify-center gap-sm shadow-sm flex-1"
                    type="button">
                    SAVE
                </button>
            </div>
        </div>
    </div>
</body>

</html>
