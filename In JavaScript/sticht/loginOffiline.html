        <style data-purpose="custom-styling">
                body {
                        font-family: 'Inter', sans-serif;
                }

                .sharp-input {
                        border: 1px solid #c7c6cb !important;
                        border-radius: 0px !important;
                        transition: all 0.2s ease-in-out;
                }

                .sharp-input::placeholder {
                        color: #838388 !important;
                }

                .sharp-input:focus {
                        border-color: #000000 !important;
                        outline: none !important;
                        box-shadow: inset 0 0 0 1px #000000 !important;
                }

                .sharp-input:disabled {
                        opacity: 0.5;
                        background-color: #f7f3f2;
                }
        </style>

<body class="min-h-screen flex items-center justify-center bg-surface relative overflow-hidden">
        <!-- BEGIN: Blurred Background Image -->
        <div
                class="absolute inset-0 z-0 flex items-center justify-center opacity-40 pointer-events-none bg-[radial-gradient(circle,_var(--tw-gradient-stops))] from-surface-dim via-surface to-background blur-[100px]">
        </div>
        <!-- END: Blurred Background Image -->
        <!-- BEGIN: MainContainer -->
        <main class="w-full flex flex-col items-center justify-center p-6 sm:p-12 z-10 relative">
                <!-- BEGIN: HeaderSection -->
                <header class="mb-10 flex flex-col items-center text-center">
                        <div class="mb-4 flex flex-col items-center">
                                <!-- Institutional logo centered -->
                                <div
                                        class="w-16 h-16 bg-primary rounded-none flex items-center justify-center text-on-primary mb-5 shadow-lg border border-outline-variant/30">
                                        <svg fill="none" height="32" stroke="currentColor" stroke-linecap="round"
                                                stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="32">
                                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5">
                                                </path>
                                        </svg>
                                </div>
                                <h1 class="text-2xl font-extrabold text-on-surface tracking-tight font-kpi-display">CASH
                                        MANAGEMENT</h1>
                                <p
                                        class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-label-caps mt-2">
                                <div
                                        style="color: rgb(0, 0, 0); background-color: rgb(239, 239, 239); font-family: Consolas, &quot;Courier New&quot;, monospace; font-size: 14px; line-height: 19px; white-space: pre;">
                                        control your money, control your life</div>
                                </p>
                        </div>
                </header>
                <!-- END: HeaderSection -->
                <!-- BEGIN: LoginCard -->
                <section
                        class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant p-10 md:p-12 shadow-2xl rounded-none relative">
                        <!-- Top accent bar for structural geometry -->
                        <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
                        <!-- BEGIN: CardTitle -->
                        <div class="text-center mb-8">
                                <h2 class="text-xl font-bold text-on-surface font-h1">LOGIN</h2>
                                <p class="text-sm text-on-surface-variant mt-2 font-body-default">Enter your credentials
                                        to access the system.</p>
                        </div>
                        <!-- END: CardTitle -->
                        <!-- BEGIN: LoginForm -->
                        <form action="#" class="space-y-6" method="POST">
                                <!-- BEGIN: EmailField -->
                                <div data-purpose="input-group">
                                        <label class="block text-xs font-bold text-on-surface mb-2 uppercase tracking-wide font-label-caps"
                                                for="email">EMAIL</label>
                                        <input class="sharp-input w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none"
                                                id="email" name="email" placeholder="name.surname@fund.gov" required=""
                                                type="email">
                                </div>
                                <!-- END: EmailField -->
                                <!-- BEGIN: PasswordField -->
                                <div data-purpose="input-group">
                                        <div class="flex justify-between items-center mb-2">
                                                <label class="block text-xs font-bold text-on-surface uppercase tracking-wide font-label-caps"
                                                        for="password">Password</label>
                                                <a class="text-xs font-bold text-secondary hover:text-primary transition-colors font-body-bold"
                                                        href="#">Forgot Password?</a>
                                        </div>
                                        <input class="sharp-input w-full px-5 py-3.5 text-sm bg-surface-container-lowest font-body-default rounded-none"
                                                id="password" name="password" placeholder="••••••••" required=""
                                                type="password">
                                </div>
                                <!-- END: PasswordField -->
                                <!-- BEGIN: ActionButtons -->
                                <div class="space-y-4 pt-6">
                                        <!-- Primary Login Button -->
                                        <button class="w-full bg-primary text-on-primary font-bold py-4 px-6 hover:bg-primary/90 transition-all text-sm uppercase tracking-widest shadow-md font-body-bold rounded-full"
                                                type="submit">
                                                Log In
                                        </button>
                                </div>
                                <div class="text-center mt-6 text-sm text-on-surface-variant font-body-default">
                                        Don't have an account? <a
                                                class="text-secondary font-bold hover:text-primary hover:underline transition-colors"
                                                href="./create.html">Sign Up</a>
                                </div>
                                <!-- END: ActionButtons -->
                        </form>
                        <!-- END: LoginForm -->
                </section>
                <!-- END: LoginCard -->
                <!-- BEGIN: PageFooter -->
                <footer
                        class="mt-12 text-on-surface-variant text-[10px] uppercase tracking-widest text-center opacity-60 font-label-caps">
                        © 2024 • Internal System v2.4
                </footer>
                <!-- END: PageFooter -->
        </main>
        <!-- END: MainContainer -->


</body>

</html>
