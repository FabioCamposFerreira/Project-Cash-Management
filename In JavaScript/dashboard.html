<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>
    <div id="main">
        <div id="firstLine">
            <p id="filterActive">ALL</p>
            <button id="buttomFilter">Filter v</button>
            <!-- TODO: filter float optons -->
            <div id="filterMenu">
                <!-- TODO: Change to calender widget with range -->
                <div id="filterMenu">
                    <label for="yearFilter">Year</label>
                    <select id="yearFilter" name="yearFilter" multiple="multiple">
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                    </select>
                    <label for="monthFilter">Mount</label>
                    <select id="monthFilter" name="monthFilter" multiple="multiple>
                        <option value=""></option>
                        <option value=" January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="KPIS">
        <div class="KPI">
            <p>Balance: <br> <span id="Balance">R$ 1000,00</span></p>
        </div>
        <div class="KPI">
            <p>Profit of this month:<br> <span id="ProfitMonth">R$ 1000,00</span></p>
            <p>Available up to the end of the month: <span id="ProfitMonth">R$ 1000,00</span></p>
        </div>
        <div class="KPI">
            <p><span></span></p>
        </div>
    </div>
    <div>
        <table id="tableTypeProfit">
            <thead>
                <th>Type</th>
                <th>Balance</th>
                <th>Mean</th>
                <th></th>
            </thead>
            <tbody>
                <tr>
                    <td>Água</td>
                    <td>
                        <p>R$</p> <span>-50</span>
                    </td> <!--TODO: IF bellow mean green, else red -->
                    <td>
                        <p>R$</p> <span>-60</span>
                    </td>
                    <td><button class="tableButton">></button></td> <!--TODO: show modal with graphic, graphic is not comulative -->
                </tr>
            </tbody>
        </table>
    </div>
    </div>
</body>
<script type="module" src="./js/inAllPages.js"></script>

</html>
